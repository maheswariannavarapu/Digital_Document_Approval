{% extends 'base.html' %}
{% block content %}
<div class="auth-page-container">
  <div class="auth-modal-card">
    <div class="auth-left">
      <h2>Admin Control Login</h2>
      <p class="auth-subtitle">System oversight, approval management, and audit trails</p>

      <form method="POST">
        <div class="form-group">
          <label>Admin Username or Email</label>
          <input type="text" name="username" class="form-input" placeholder="e.g. admin" value="admin" required>
        </div>
        <div class="form-group">
          <label>Security Password</label>
          <input type="password" name="password" class="form-input" placeholder="••••••••••••" value="password123" required>
        </div>

        <div class="auth-actions-row">
          <button type="submit" class="btn-auth-primary" style="background: #1e1b4b;">Admin Login</button>
          <a href="{{ url_for('home') }}" class="btn-auth-secondary">Cancel</a>
        </div>
      </form>
    </div>

    <div class="auth-right">
      <div class="user-badge-avatar" style="background:#1e1b4b;">🛡️</div>
      <h3 style="font-size: 1.2rem; margin-bottom: 0.2rem;">Executive Governance</h3>
      <p style="color: #6b7280; font-size: 0.85rem; margin-bottom: 1.5rem;">Access final sign-offs & audit history</p>
      
      <a href="{{ url_for('user_login') }}" class="btn-auth-secondary" style="background:#fff;">
        Switch to User Login
      </a>
    </div>
  </div>
</div>
{% endblock %}
