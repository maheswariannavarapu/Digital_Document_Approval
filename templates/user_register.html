{% extends 'base.html' %}
{% block content %}
<div class="auth-page-container">
  <div class="auth-modal-card">
    <div class="auth-left" style="flex:1;">
      <h2>Register Account</h2>
      <p class="auth-subtitle">Join the DocFlow platform as a User, Reviewer, or Manager</p>

      <form method="POST">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" name="full_name" class="form-input" placeholder="e.g. Maheswari" required>
        </div>
        <div class="form-group">
          <label>Username</label>
          <input type="text" name="username" class="form-input" placeholder="e.g. johndoe" required>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" name="email" class="form-input" placeholder="name@company.com" required>
        </div>
        <div class="form-group">
          <label>System Role</label>
          <select name="role" class="form-input">
            <option value="user">User (Upload & Submit)</option>
            <option value="reviewer">Reviewer (First-tier Review & Notes)</option>
            <option value="manager">Manager (Mid-tier Decision)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" class="form-input" placeholder="Create password" required>
        </div>

        <div class="auth-actions-row">
          <button type="submit" class="btn-auth-primary">Complete Registration</button>
          <a href="{{ url_for('user_login') }}" class="btn-auth-secondary">Back to Login</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
