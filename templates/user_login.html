{% extends 'base.html' %}
{% block content %}
<div class="auth-page-container">
  <div class="auth-modal-card">
    <div class="auth-left">
      <h2>User Login</h2>
      <p class="auth-subtitle">Upload documents and manage pending sign-offs</p>

      <form method="POST" action="{{ url_for('user_login') }}" autocomplete="off">
        <div class="form-group">
          <label>Username or Email Address</label>
          <input type="text" name="username" class="form-input" placeholder="e.g. johndoe" autocomplete="on" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" class="form-input" placeholder="••••••••••••" autocomplete="password123" required>
        </div>

        <div class="auth-actions-row">
          <button type="submit" class="btn-auth-primary">User Login</button>
          <a href="{{ url_for('home') }}" class="btn-auth-secondary">Cancel</a>
        </div>
      </form>
    </div>

    <div class="auth-right">
      <div class="user-badge-avatar">👤</div>
      <h3 style="font-size: 1.2rem; margin-bottom: 0.2rem;">User Sign-off Portal</h3>
      <p style="color: #6b7280; font-size: 0.85rem; margin-bottom: 1.5rem;">Verified workflow participant</p>
      
      <a href="{{ url_for('admin_login') }}" class="btn-auth-secondary" style="background:#fff; border-color:#c4b5fd;">
        Switch to Admin Login
      </a>
    </div>
  </div>
</div>
{% endblock %}
